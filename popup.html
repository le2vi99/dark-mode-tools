<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selective Dark Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root { color-scheme: dark; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      background: #1a1a1a;
      color: #e8e8e8;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #2e2e2e;
    }
    .header-icon { font-size: 20px; }
    .header h1 { font-size: 14px; font-weight: 600; color: #fff; }

    /* ── Current site toggle ── */
    .current-site {
      padding: 14px 16px;
      border-bottom: 1px solid #2e2e2e;
    }
    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .site-info { min-width: 0; }
    .site-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .site-hostname {
      font-size: 13px;
      font-weight: 500;
      color: #4fa3e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Toggle switch ── */
    .toggle-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .toggle-label { font-size: 12px; color: #aaa; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: background 200ms;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 200ms;
    }
    .switch input:checked + .slider { background: #4fa3e0; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:focus-visible + .slider {
      outline: 2px solid #4fa3e0;
      outline-offset: 2px;
    }

    /* ── Site list ── */
    .sites-section { padding: 12px 16px; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .sites-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
    }
    .sites-list:empty::after {
      content: "No sites configured yet";
      color: #555;
      font-size: 12px;
      display: block;
      padding: 8px 0;
    }
    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      background: #242424;
      gap: 8px;
    }
    .site-item-host {
      font-size: 12px;
      color: #ccc;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-item-host.active { color: #4fa3e0; }
    .site-item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .temp-badge {
      font-size: 9px;
      font-weight: 700;
      color: #e09a4f;
      background: #3d2a0f;
      border: 1px solid rgba(224, 154, 79, 0.3);
      border-radius: 3px;
      padding: 1px 4px;
      letter-spacing: 0.05em;
    }
    .site-item-host.temp { color: #e09a4f; }
    .remove-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color 150ms, background 150ms;
    }
    .remove-btn:hover { color: #e06060; background: #2e1a1a; }

    /* ── Temp session button ── */
    .temp-row { margin-top: 8px; }
    .temp-btn {
      width: 100%;
      padding: 5px 10px;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      transition: all 150ms;
      text-align: center;
    }
    .temp-btn:hover { background: #2a2a2a; color: #ccc; border-color: #e09a4f; }
    .temp-btn.active { background: #3d2a0f; border-color: #e09a4f; color: #e09a4f; }

    /* ── Add custom site ── */
    .add-section {
      padding: 10px 16px 14px;
      border-top: 1px solid #2e2e2e;
    }
    .add-row {
      display: flex;
      gap: 6px;
    }
    .add-input {
      flex: 1;
      padding: 6px 10px;
      background: #242424 !important;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8 !important;
      -webkit-text-fill-color: #e8e8e8 !important;
      caret-color: #e8e8e8 !important;
      -webkit-appearance: none;
      appearance: none;
      font-size: 12px;
      outline: none;
      transition: border-color 150ms;
    }
    .add-input::placeholder { color: #555; -webkit-text-fill-color: #555; }
    .add-input:focus { border-color: #4fa3e0; }
    .add-input:-webkit-autofill,
    .add-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e8e8e8 !important;
      -webkit-box-shadow: 0 0 0 1000px #242424 inset !important;
    }
    .add-btn {
      padding: 6px 12px;
      background: #1a5f8a;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms;
      white-space: nowrap;
    }
    .add-btn:hover { background: #1e6fa0; }
    .add-btn:focus-visible { outline: 2px solid #4fa3e0; outline-offset: 2px; }

    /* ── Scrollbar ── */
    .sites-list::-webkit-scrollbar { width: 4px; }
    .sites-list::-webkit-scrollbar-track { background: transparent; }
    .sites-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🌙</span>
    <h1>Selective Dark Mode</h1>
  </div>

  <div class="current-site">
    <div class="site-row">
      <div class="site-info">
        <div class="site-label">Current site</div>
        <div class="site-hostname" id="current-hostname">—</div>
      </div>
      <div class="toggle-wrap">
        <span class="toggle-label" id="toggle-label">Off</span>
        <label class="switch">
          <input type="checkbox" id="site-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="temp-row">
      <button class="temp-btn" id="temp-btn">Enable for session</button>
    </div>
  </div>

  <div class="sites-section">
    <div class="section-title">Enabled sites</div>
    <div class="sites-list" id="sites-list"></div>
  </div>

  <div class="add-section">
    <div class="add-row">
      <input
        type="text"
        id="add-input"
        class="add-input"
        placeholder="example.com"
        spellcheck="false"
      />
      <button class="add-btn" id="add-btn">Add</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
